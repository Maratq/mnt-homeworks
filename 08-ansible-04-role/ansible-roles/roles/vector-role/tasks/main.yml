---
- name: Add Vector repository
  ansible.builtin.apt_repository:
    repo: "{{ vector_repo }}"
    state: present
    update_cache: true
  tags:
    - vector

- name: Install Vector
  ansible.builtin.apt:
    name: "{{ vector_packages }}"
    state: present
  tags:
    - vector

- name: Configure Vector
  ansible.builtin.template:
    src: vector.toml.j2
    dest: "{{ vector_config_dir }}/vector.toml"
    owner: "{{ vector_user }}"
    group: "{{ vector_group }}"
    mode: '0644'
  notify:
    - restart vector
  tags:
    - vector

- name: Start Vector
  ansible.builtin.service:
    name: vector
    state: started
    enabled: true
  tags:
    - vector
