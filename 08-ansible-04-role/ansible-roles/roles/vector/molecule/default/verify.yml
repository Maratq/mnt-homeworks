---
- name: Verify
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Check if vector binary exists
      ansible.builtin.command:
        cmd: which vector
      register: vector_bin
      changed_when: false
      failed_when: vector_bin.rc != 0

    - name: Check vector version
      ansible.builtin.command:
        cmd: vector --version
      register: vector_version
      changed_when: false

    - name: Check vector config directory exists
      ansible.builtin.stat:
        path: /etc/vector
      register: vector_config_dir

    - name: Check vector config file exists
      ansible.builtin.stat:
        path: /etc/vector/vector.toml
      register: vector_config_file

    - name: Validate vector config
      ansible.builtin.command:
        cmd: vector validate --config /etc/vector/vector.toml
      register: vector_config_valid
      changed_when: false
      failed_when: vector_config_valid.rc != 0

    - name: Check vector service is running
      ansible.builtin.systemd:
        name: vector
        state: started
      register: vector_service
      failed_when: vector_service.status.ActiveState != "active"

    - name: Display summary
      ansible.builtin.debug:
        msg:
          - "=========================================="
          - "✅ Vector binary: {{ vector_bin.stdout }}"
          - "✅ Vector version: {{ vector_version.stdout }}"
          - "✅ Config validation: {{ 'PASSED' if vector_config_valid.rc == 0 else 'FAILED' }}"
          - "✅ Config directory: {{ 'exists' if vector_config_dir.stat.exists else 'missing' }}"
          - "✅ Config file: {{ 'exists' if vector_config_file.stat.exists else 'missing' }}"
          - "✅ Vector service: {{ vector_service.status.ActiveState }}"
          - "=========================================="
