---
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: instance
    image: aragast/netology:latest
    pre_build_image: true
    privileged: true
provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  name: podman
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - verify
    - destroy
