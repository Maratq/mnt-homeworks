---
- name: Check if ClickHouse is already running
  ansible.builtin.command:
    cmd: clickhouse-client -q "SELECT 1"
  register: clickhouse_running
  changed_when: false
  failed_when: false
  ignore_errors: true

- name: Start ClickHouse manually if not running
  ansible.builtin.shell:
    cmd: |
      if ! pgrep -f clickhouse-server > /dev/null; then
        sudo /usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml --daemon
        echo "started"
      else
        echo "already running"
      fi
    creates: /var/run/clickhouse-server/clickhouse-server.pid
  register: clickhouse_start
  changed_when: "'started' in clickhouse_start.stdout"
  when: clickhouse_running.rc != 0 or clickhouse_running is failed
  ignore_errors: true

- name: Check if ClickHouse is running
  ansible.builtin.command:
    cmd: clickhouse-client -q "SELECT 1"
  register: clickhouse_test
  changed_when: false
  ignore_errors: true

- name: Display ClickHouse status
  ansible.builtin.debug:
    msg: |
      ClickHouse installation status:
      - Service: {{ '✅ Running' if clickhouse_test.rc == 0 else '❌ Not running' }}
      - Version: {{ clickhouse_version | default('unknown') }}
  when: clickhouse_test is defined
