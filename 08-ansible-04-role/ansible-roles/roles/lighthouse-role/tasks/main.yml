---
- name: Install Nginx and git
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: present
    update_cache: true
  tags:
    - lighthouse

- name: Clone Lighthouse repository
  ansible.builtin.git:
    repo: "{{ lighthouse_repo }}"
    dest: "{{ lighthouse_dir }}"
    version: "{{ lighthouse_version }}"
    force: true
  tags:
    - lighthouse

- name: Configure Nginx for Lighthouse
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/lighthouse
    owner: root
    group: root
    mode: '0644'
  notify:
    - restart nginx
  tags:
    - lighthouse

- name: Enable Nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/lighthouse
    dest: /etc/nginx/sites-enabled/lighthouse
    state: link
  notify:
    - restart nginx
  tags:
    - lighthouse

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify:
    - restart nginx
  tags:
    - lighthouse

- name: Start Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
  tags:
    - lighthouse
